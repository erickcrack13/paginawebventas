<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario - Ventas de Computadoras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ==================================== */
        /* SECCIÓN 1: ESTILOS GENERALES Y VIDEO/IMAGEN DE FONDO */
        /* ==================================== */

        /* Estilos para el fondo (puede ser imagen o video, adaptado para la página de gestión) */
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            /* Usando una imagen de fondo para esta página, como la que mencionaste */
            background: url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
            background-size: cover;
            /* filter: brightness(85%); Removido para usar una capa ::before más controlable */
        }
        
        /* Contenedor para oscurecer el fondo si la imagen no es suficiente */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Capa oscura para mayor contraste */
            z-index: -1;
        }

        /* ==================================== */
        /* FIN SECCIÓN 1 */
        /* ==================================== */


        /* ==================================== */
        /* SECCIÓN 2: ESTILOS DEL ENCABEZADO (HEADER) - ¡MODIFICADA! */
        /* ==================================== */
        header {
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.8) 0%, rgba(14, 165, 233, 0.8) 100%);
            color: #ffffff;
            padding: 48px 20px 32px 20px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.08);
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.2em;
            margin: 0 auto;
            text-align: center;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-shadow: 0 2px 12px rgba(0,0,0,0.08), 0 1px 0 #0ea5e9;
            line-height: 1.1;
            position: relative;
            z-index: 1;
        }

        .header-buttons {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            align-items: flex-start;
            padding-top: 48px;
            padding-left: 20px;
            box-sizing: border-box;
            z-index: 20;
        }

        .support-button,
        .header-button {
            background: #f97316;
            color: #fff;
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            width: 90%; /* Para que los botones se ajusten bien en el menú */
            max-width: 300px;
            margin: 5px auto; /* Centra los botones dentro del menú */
            box-sizing: border-box;
        }

        .support-button:hover,
        .header-button:hover {
            background: #ea580c;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
        }

        .header-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }

        /* --- Botón "Volver al Inventario" - Mantenido y ajustado --- */
        .back-button {
            position: absolute;
            top: 20px;
            right: 20px; /* Cambiado a la derecha para no chocar con el menú */
            background: #f97316; /* Naranja vibrante */
            color: #fff;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100; /* Asegura que esté por encima de otros elementos */
        }

        .back-button:hover {
            background: #ea580c; /* Naranja más oscuro al pasar el ratón */
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
        }
        /* ==================================== */
        /* FIN SECCIÓN 2 */
        /* ==================================== */


        /* ==================================== */
        /* SECCIÓN 3: ESTILOS DEL BOTÓN DE MENÚ "HOT DOG" (HAMBURGUESA) */
        /* ==================================== */
        .hotdog-menu-button {
            display: block;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            position: relative;
            z-index: 100; /* Asegura que esté por encima de todo */
            color: #ffffff;
            font-size: 1.5em;
        }

        .hotdog-menu-icon {
            display: block;
            width: 30px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .hotdog-menu-icon::before,
        .hotdog-menu-icon::after {
            content: '';
            display: block;
            width: 30px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            position: absolute;
            transition: transform 0.3s ease;
        }

        .hotdog-menu-icon::before {
            top: -10px;
        }

        .hotdog-menu-icon::after {
            top: 10px;
        }

        /* Animation for closing the menu (X icon) */
        .hotdog-menu-button.open .hotdog-menu-icon {
            background-color: transparent;
        }

        .hotdog-menu-button.open .hotdog-menu-icon::before {
            transform: translateY(10px) rotate(45deg);
        }

        .hotdog-menu-button.open .hotdog-menu-icon::after {
            transform: translateY(-10px) rotate(-45deg);
        }
        /* ==================================== */
        /* FIN SECCIÓN 3 */
        /* ==================================== */


        /* ==================================== */
        /* SECCIÓN 4: ESTILOS DEL CONTENIDO DEL MENÚ PRINCIPAL (TODAS LAS PANTALLAS) */
        /* ==================================== */
        .dropdown-menu-content {
            display: none; /* Por defecto oculto */
            flex-direction: column;
            align-items: center; /* Centra los botones horizontalmente */
            background: rgba(99, 102, 241, 0.95); /* Fondo azul con transparencia */
            padding: 20px 0;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            position: absolute;
            /* Posicionamiento relativo al header, ajustado para no chocar con el título */
            top: calc(48px + 30px + 10px); /* Ajustado para que baje un poco más */
            left: 20px;
            right: auto;
            width: 220px; /* Ancho fijo para el menú */
            max-width: 90%; /* Asegura que no se desborde en pantallas muy pequeñas */
            z-index: 90; /* Por encima del contenido principal, pero debajo del botón de hamburguesa */
            transform-origin: top left;
            opacity: 0;
            transform: scaleY(0);
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }

        /* Clase para mostrar el menú */
        .dropdown-menu-content.active {
            display: flex;
            opacity: 1;
            transform: scaleY(1);
        }
        /* ==================================== */
        /* FIN SECCIÓN 4 */
        /* ==================================== */


        /* --- Contenedor Principal de Contenido (MAIN) --- */
        main {
            background: #fff;
            padding: 40px 32px 32px 32px;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.10);
            width: 90%; /* Ajuste para que los bloques puedan caber horizontalmente */
            max-width: 1200px; /* Ancho máximo para el contenido principal */
            margin-top: -40px; /* Superpone un poco sobre el header */
            margin-bottom: 40px; /* Espacio inferior para un mejor scroll */
            box-sizing: border-box; /* Incluye padding en el ancho total */
            position: relative; /* Para z-index */
            z-index: 5; /* Asegura que esté por encima del fondo */
        }

        h2 {
            text-align: center;
            color: #3730a3;
            margin-bottom: 28px;
            font-weight: 600;
            font-size: 1.6em;
        }

        /* Nuevo contenedor para las secciones de productos (Accesorios y Computadoras) */
        .product-sections-container {
            display: flex; /* Habilita Flexbox */
            flex-wrap: wrap; /* Permite que los elementos se envuelvan si no hay suficiente espacio */
            gap: 20px; /* Espacio entre las secciones */
            justify-content: center; /* Centra las secciones horizontalmente */
            margin-bottom: 28px; /* Espacio antes del formulario de gestión */
        }

        /* --- Secciones de Lista de Productos (Accesorios, Computadoras, Componentes) --- */
        .lista-productos {
            background: #f3f4f6; /* Fondo ligero para la sección de lista */
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(99, 102, 241, 0.10);
            padding: 22px 28px 14px 28px;
            flex: 1; /* Permite que cada sección ocupe el mismo espacio disponible */
            min-width: 300px; /* Ancho mínimo para cada sección de producto */
            box-sizing: border-box;
            /* margin-bottom: 28px; Removido, ahora el gap del contenedor maneja el espacio */
        }

        .lista-productos h3 {
            color: #0ea5e9; /* Azul para los títulos de categoría */
            margin-top: 8px;
            margin-bottom: 12px;
            border-bottom: 2px solid #e0e7ff;
            padding-bottom: 8px;
            font-size: 1.15em;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lista-productos ul {
            list-style: none; /* Remueve los puntos de lista */
            padding: 0;
            margin: 0;
        }

        .lista-productos li {
            padding: 14px 0;
            border-bottom: 1px solid #f1f5f9; /* Separador sutil */
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap; /* Permite que los elementos se envuelvan en líneas nuevas */
            font-size: 1.05em;
            transition: background 0.2s;
        }
        
        /* Estilos para la imagen del producto en la lista */
        .lista-productos li .product-image {
            width: 50px; /* Tamaño de la imagen */
            height: 50px;
            object-fit: cover; /* Asegura que la imagen cubra el área sin distorsión */
            border-radius: 8px; /* Bordes ligeramente redondeados */
            margin-right: 15px; /* Espacio a la derecha de la imagen */
            flex-shrink: 0; /* Evita que la imagen se encoja */
        }

        .lista-productos li:last-child {
            border-bottom: none; /* No hay separador en el último elemento */
        }

        /* --- Insignias de Stock --- */
        .stock-badge {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.93em;
            font-weight: 600;
            margin-left: 12px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.07);
            flex-shrink: 0; /* Evita que el badge se encoja en pantallas pequeñas */
            margin-top: 5px; /* Pequeño ajuste para móviles si se envuelve */
        }

        .stock-available {
            background: linear-gradient(90deg, #bbf7d0 0%, #a7f3d0 100%); /* Verde claro */
            color: #047857;
        }

        .stock-low {
            background: linear-gradient(90deg, #fef9c3 0%, #fde68a 100%); /* Amarillo */
            color: #b45309;
        }

        .stock-out {
            background: linear-gradient(90deg, #fecaca 0%, #fca5a5 100%); /* Rojo */
            color: #b91c1c;
        }

        /* --- Sección de Gestión de Producto (Formulario) --- */
        .gestion-inventario {
            background: #e0e7ff; /* Fondo azul claro para el formulario */
            border-radius: 18px;
            padding: 22px 28px;
            margin-bottom: 28px;
            box-shadow: 0 4px 18px rgba(99, 102, 241, 0.08);
            box-sizing: border-box;
            width: 100%; /* Asegura que ocupe todo el ancho disponible dentro de main */
        }

        .gestion-inventario h3 {
            color: #3730a3;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3em;
            text-align: center;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 10px;
        }

        .gestion-inventario label {
            display: block;
            margin-bottom: 8px;
            color: #3730a3;
            font-weight: 600;
        }

        .gestion-inventario input[type="text"],
        .gestion-inventario input[type="number"],
        .gestion-inventario select {
            width: calc(100% - 22px); /* Ancho total menos padding */
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Montserrat', Arial, sans-serif;
            font-size: 1em;
            box-sizing: border-box;
        }

        .gestion-inventario button {
            background: linear-gradient(90deg, #10b981 0%, #059669 100%); /* Verde para añadir/actualizar */
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: background 0.3s ease, transform 0.2s ease;
            margin-right: 10px;
        }

        .gestion-inventario button:hover {
            background: linear-gradient(90deg, #059669 0%, #10b981 100%);
            transform: translateY(-1px);
        }

        /* --- Botones de Acción de Productos (Editar/Eliminar) --- */
        .product-actions {
            display: flex;
            gap: 8px; /* Espacio entre los botones */
            margin-top: 5px; /* Ajuste si el nombre del producto es largo y se envuelve */
            flex-shrink: 0;
        }

        .product-actions button {
            background: #f59e0b; /* Amarillo para editar */
            color: #fff;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background 0.2s;
            margin-right: 0; /* Anula el margin-right del estilo general de botón */
        }

        .product-actions button:hover {
            background: #d97706; /* Amarillo más oscuro al pasar el ratón */
        }

        .product-actions .delete-btn {
            background: #ef4444; /* Rojo para eliminar */
        }

        .product-actions .delete-btn:hover {
            background: #dc2626; /* Rojo más oscuro al pasar el ratón */
        }

        /* --- Media Queries para Responsividad --- */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5em;
            }
            header {
                padding: 48px 15px 32px 15px;
            }
            .header-buttons {
                padding-left: 15px;
            }
            .dropdown-menu-content {
                left: 15px;
            }
            /* Ajuste para el botón de volver en pantallas pequeñas */
            .back-button { 
                position: static; /* Deja de ser flotante */
                margin-top: 15px;
                display: block; /* Ocupa su propia línea */
                width: fit-content;
                margin-left: auto;
                margin-right: auto; /* Centra el botón */
            }
            main {
                padding: 30px 20px;
            }
            /* En pantallas pequeñas, las secciones de productos se apilan de nuevo */
            .product-sections-container {
                flex-direction: column;
                gap: 28px; /* Restaura el espacio vertical */
            }
            .lista-productos {
                padding: 18px 20px 10px 20px;
                min-width: unset; /* Elimina el ancho mínimo para que se ajuste al 100% */
                width: 100%;
            }
            .lista-productos li {
                flex-direction: column; /* Apila elementos verticalmente */
                align-items: flex-start; /* Alinea los elementos a la izquierda */
            }
            .stock-badge, .product-actions {
                margin-left: 0; /* Elimina margen extra en móviles */
                width: 100%; /* Ocupa todo el ancho disponible */
                justify-content: flex-start; /* Alinea los botones de acción a la izquierda */
            }
            .product-actions button {
                width: auto; /* Permite que los botones se ajusten a su contenido */
                margin-top: 8px; /* Espacio superior para los botones de acción */
            }
            .lista-productos li .product-image {
                margin-right: 0;
                margin-bottom: 10px; /* Espacio debajo de la imagen en modo apilado */
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 2em;
            }
            .support-button,
            .header-button,
            .dropdown-menu-content button {
                padding: 10px 18px;
                font-size: 0.95em;
                width: 90%;
            }
            .dropdown-menu-content {
                width: 200px;
                left: 15px;
            }
            .gestion-inventario button {
                padding: 12px 20px;
                font-size: 1em;
                margin: 8px 0; /* Espacio vertical entre botones en móvil */
                width: 90%; /* Ancho casi completo para los botones del formulario */
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Gestión de Inventario</h1>
        <div class="header-buttons">
            <button class="hotdog-menu-button" id="hotdog-menu-toggle">
                <span class="hotdog-menu-icon"></span>
            </button>

            <div class="dropdown-menu-content" id="main-menu-content">
                <a href="soporte tecnico.html" class="support-button">
                    Soporte Técnico
                </a>
                <button id="mostrar-precios" class="header-button">Ver Detalles y Precios</button>
                <button id="mostrar-pago" class="header-button">Ir a Pago</button>
                <button id="ir-gestion-btn" class="header-button">Gestionar Inventario</button>
                <button id="cliente-registro-btn" class="header-button">Cliente Registro</button>
            </div>
        </div>
        <a href="index.html" class="back-button">
            Volver al Inventario
        </a>
    </header>
    <!-- No se requiere HTML adicional aquí, pero debes modificar el script para que los enlaces de las imágenes se mantengan en todos los dispositivos.
    Solución: Guarda y carga los productos siempre desde localStorage, incluso en dispositivos nuevos. Así los links de las fotos no desaparecen. 
    Agrega este bloque justo antes de tu <main> para inicializar correctamente el inventario desde localStorage si existe: -->

    <script>
        // Si hay productos en localStorage, siempre los usamos (no sobrescribas con predeterminados)
        if (localStorage.getItem('productosInventario')) {
            productos = JSON.parse(localStorage.getItem('productosInventario'));
        }
    </script>
    <main>
        <h2>Inventario de Productos</h2>

        <div class="product-sections-container">
            <div class="lista-productos">
                <h3>
                    Accesorios
                    <button type="button" id="toggle-accesorios" style="font-size:0.9em; padding:4px 10px; border-radius:6px; border:none; background:#6366f1; color:#fff; cursor:pointer;">Ocultar</button>
                </h3>
                <ul id="lista-accesorios">
                </ul>
            </div>

            <div class="lista-productos">
                <h3>
                    Computadoras
                    <button type="button" id="toggle-computadoras" style="font-size:0.9em; padding:4px 10px; border-radius:6px; border:none; background:#6366f1; color:#fff; cursor:pointer;">Ocultar</button>
                </h3>
                <ul id="lista-computadoras">
                </ul>
            </div>

            <div class="lista-productos">
                <h3>
                    Componentes de la Computadora
                    <button type="button" id="toggle-componentes" style="font-size:0.9em; padding:4px 10px; border-radius:6px; border:none; background:#6366f1; color:#fff; cursor:pointer;">Ocultar</button>
                </h3>
                <ul id="lista-componentes">
                </ul>
            </div>
        </div> 
        
        <div class="gestion-inventario">
            <h3>Gestionar Producto</h3>
            <form id="product-form">
                <input type="hidden" id="product-id"> 
                <label for="product-name">Nombre del Producto:</label>
                <input type="text" id="product-name" required>

                <label for="product-price">Precio:</label>
                <input type="number" id="product-price" step="0.01" min="0" required>

                <label for="product-stock">Stock Disponible:</label>
                <input type="number" id="product-stock" min="0" required>

                <label for="product-image-url">URL de la Imagen:</label>
                <input type="text" id="product-image-url" placeholder="Ej: https://ejemplo.com/imagen.jpg">

                <label for="product-category">Categoría:</label>
                <select id="product-category" required>
                    <option value="accesorios">Accesorios</option>
                    <option value="computadoras">Computadoras</option>
                    <option value="componentes">Componentes de la Computadora</option> </select>
                <br><br>
                <button type="submit" id="add-update-btn">Agregar Producto</button>
                <button type="button" id="clear-form-btn" style="background:#6b7280;">Limpiar Formulario</button>
            </form>
        </div>
    </main>

    <script>
        // --- Redirección de Seguridad (Verifica si el admin está logueado) ---
        // Esto es crucial para proteger la página de gestión.
        if (sessionStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'admin_login.html'; // Redirige si no hay sesión activa
        }

        // --- Carga y Guardado de Productos en localStorage ---
        // Intenta cargar productos desde localStorage. Si no hay, usa un conjunto predeterminado.
        // Siempre carga los productos desde localStorage si existen, para no perder los links de las fotos
        let productos;
        if (localStorage.getItem('productosInventario')) {
            productos = JSON.parse(localStorage.getItem('productosInventario'));
        } else {
            productos = [
                // Productos predeterminados para el inventario inicial
                { id: Date.now() + 1, nombre: 'Mouse Óptico', precio: 15.00, categoria: 'accesorios', DISPONIBLE: 20, urlImagen: 'https://images.unsplash.com/photo-1547944111-ad775089e5a1?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 2, nombre: 'Auriculares Gaming', precio: 25.50, categoria: 'accesorios', DISPONIBLE: 15, urlImagen: 'https://images.unsplash.com/photo-1546435770-a3e426bf4722?q=80&w=1465&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 3, nombre: 'Teclado Mecánico', precio: 30.00, categoria: 'accesorios', DISPONIBLE: 10, urlImagen: 'https://images.unsplash.com/photo-1587823555239-01f2f81643c5?q=80&w=1470&auto=format&fit=fit&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 4, nombre: 'Monitor Curvo 27"', precio: 180.00, categoria: 'accesorios', DISPONIBLE: 5, urlImagen: 'https://images.unsplash.com/photo-1579737158379-373981882d27?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 5, nombre: 'Webcam HD', precio: 40.00, categoria: 'accesorios', DISPONIBLE: 25, urlImagen: 'https://images.unsplash.com/photo-1596700055742-12711d99d146?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 6, nombre: 'Impresora Multifuncional', precio: 120.00, categoria: 'accesorios', DISPONIBLE: 8, urlImagen: 'https://images.unsplash.com/photo-1629854284698-f2b7b5c8f1f5?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 7, nombre: 'Laptop Gamer (Intel i5)', precio: 800.00, categoria: 'computadoras', DISPONIBLE: 7, urlImagen: 'https://images.unsplash.com/photo-1593642532454-ee09795e135e?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 8, nombre: 'PC Escritorio (Intel i7)', precio: 1000.00, categoria: 'computadoras', DISPONIBLE: 3, urlImagen: 'https://images.unsplash.com/photo-1629910531235-95079a499d1e?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 9, nombre: 'Mini PC (AMD Ryzen 3)', precio: 350.00, categoria: 'computadoras', DISPONIBLE: 12, urlImagen: 'https://images.unsplash.com/photo-1630138547378-b57088b9952a?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 10, nombre: 'Workstation Profesional', precio: 2200.00, categoria: 'computadoras', DISPONIBLE: 2, urlImagen: 'https://images.unsplash.com/photo-1629910531235-95079a499d1e?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 11, nombre: 'Chromebook Ligera', precio: 300.00, categoria: 'computadoras', DISPONIBLE: 9, urlImagen: 'https://images.unsplash.com/photo-1541807056-b8b8b3b3b3b3?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                // Nuevos productos de ejemplo para la categoría "componentes"
                { id: Date.now() + 12, nombre: 'CPU Intel Core i7', precio: 350.00, categoria: 'componentes', DISPONIBLE: 8, urlImagen: 'https://images.unsplash.com/photo-1616886918070-e4d6d3d4b6c3?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 13, nombre: 'GPU NVIDIA RTX 3060', precio: 400.00, categoria: 'componentes', DISPONIBLE: 5, urlImagen: 'https://images.unsplash.com/photo-1601264426574-d4d1e2e3f4e2?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' },
                { id: Date.now() + 14, nombre: 'Memoria RAM 16GB DDR4', precio: 70.00, categoria: 'componentes', DISPONIBLE: 30, urlImagen: 'https://images.unsplash.com/photo-1591785566089-a2e6b7b2b0c3?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D' }
            ];
            // Solo guarda los productos predeterminados si no hay nada en localStorage
            productos = productos.map((p, index) => ({ ...p, id: Date.now() + index }));
            saveProducts();
        }

        // Asegúrate de que los IDs iniciales sean únicos para que no haya conflictos al agregar nuevos
        if (!localStorage.getItem('productosInventario')) {
            productos = productos.map((p, index) => ({ ...p, id: Date.now() + index }));
            saveProducts();
        }


        /**
         * Guarda el array de productos actualizado en el localStorage del navegador.
         */
        function saveProducts() {
            localStorage.setItem('productosInventario', JSON.stringify(productos));
        }

        // --- Referencias a Elementos del DOM ---
        const listaAccesoriosUl = document.getElementById('lista-accesorios');
        const listaComputadorasUl = document.getElementById('lista-computadoras');
        const listaComponentesUl = document.getElementById('lista-componentes'); // Nueva referencia

        // Elementos del formulario de gestión de productos
        const productForm = document.getElementById('product-form');
        const productIdInput = document.getElementById('product-id');
        const productNameInput = document.getElementById('product-name');
        const productPriceInput = document.getElementById('product-price');
        const productStockInput = document.getElementById('product-stock');
        const productImageUrlInput = document.getElementById('product-image-url'); // Nuevo campo de imagen
        const productCategoryInput = document.getElementById('product-category');
        const addUpdateBtn = document.getElementById('add-update-btn');
        const clearFormBtn = document.getElementById('clear-form-btn');

        // Referencias para el menú de hamburguesa
        const hotdogMenuToggle = document.getElementById('hotdog-menu-toggle');
        const mainMenuContent = document.getElementById('main-menu-content');
        const mostrarPreciosBtn = document.getElementById('mostrar-precios');
        const mostrarPagoBtn = document.getElementById('mostrar-pago');
        const irGestionBtn = document.getElementById('ir-gestion-btn');
        const clienteRegistroBtn = document.getElementById('cliente-registro-btn');

        // Deshabilita el botón "Gestionar Inventario" en esta página
        if (irGestionBtn) {
            irGestionBtn.disabled = true;
            irGestionBtn.textContent = 'Estás aquí'; // O cualquier texto que indique que ya está en la página
        }

        // Botones de ocultar/mostrar secciones
        const toggleAccesoriosBtn = document.getElementById('toggle-accesorios');
        const toggleComputadorasBtn = document.getElementById('toggle-computadoras');
        const toggleComponentesBtn = document.getElementById('toggle-componentes'); // Nuevo botón de toggle


        // --- Funciones de Gestión del Inventario ---

        /**
         * Renderiza (muestra) la lista de productos en el HTML.
         * Cada producto se clasifica por categoría y se le añaden botones de acción.
         */
        function actualizarInventarioVisual() {
            // Limpia todas las listas antes de volver a renderizar
            listaAccesoriosUl.innerHTML = ''; 
            listaComputadorasUl.innerHTML = '';
            listaComponentesUl.innerHTML = ''; // Limpia la nueva lista

            productos.forEach(producto => {
                const listItem = document.createElement('li');
                
                // Agrega la imagen del producto
                const img = document.createElement('img');
                img.src = producto.urlImagen || 'https://via.placeholder.com/100x100?text=No+Image'; // Si no hay URL, usa un placeholder
                img.alt = producto.nombre;
                img.title = producto.nombre; // Título para tooltip
                img.classList.add('product-image');
                listItem.appendChild(img);

                // Contenedor para el nombre y el precio
                const productInfoDiv = document.createElement('div');
                productInfoDiv.style.flexGrow = '1'; // Permite que ocupe el espacio disponible
                productInfoDiv.style.marginRight = '10px'; // Espacio antes del badge

                const productNameText = document.createElement('span');
                productNameText.textContent = producto.nombre;
                productInfoDiv.appendChild(productNameText);

                const priceSpan = document.createElement('span');
                priceSpan.textContent = ` ($${producto.precio.toFixed(2)})`; // Formatea el precio a 2 decimales
                productInfoDiv.appendChild(priceSpan);
                listItem.appendChild(productInfoDiv);

                // Insignia de stock (disponible, bajo, agotado)
                const stockBadge = document.createElement('span');
                stockBadge.classList.add('stock-badge');

                if (producto.DISPONIBLE > 10) {
                    stockBadge.classList.add('stock-available');
                } else if (producto.DISPONIBLE > 0) {
                    stockBadge.classList.add('stock-low');
                } else {
                    stockBadge.classList.add('stock-out');
                }
                stockBadge.textContent = `Stock: ${producto.DISPONIBLE}`;
                listItem.appendChild(stockBadge);

                // Botones de acción (Editar y Eliminar)
                const actionsDiv = document.createElement('div');
                actionsDiv.classList.add('product-actions');

                const editButton = document.createElement('button');
                editButton.textContent = 'Editar';
                editButton.onclick = () => cargarProductoParaEdicion(producto.id);
                actionsDiv.appendChild(editButton);

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Eliminar';
                deleteButton.classList.add('delete-btn');
                deleteButton.onclick = () => eliminarProducto(producto.id);
                actionsDiv.appendChild(deleteButton);

                listItem.appendChild(actionsDiv);

                // Añade el item a la lista de su categoría correspondiente
                if (producto.categoria === 'accesorios') {
                    listaAccesoriosUl.appendChild(listItem);
                } else if (producto.categoria === 'computadoras') {
                    listaComputadorasUl.appendChild(listItem);
                } else if (producto.categoria === 'componentes') { // Nueva condición
                    listaComponentesUl.appendChild(listItem);
                }
            });
        }

        /**
         * Carga los datos de un producto en el formulario para su edición.
         * @param {number} id - El ID del producto a editar.
         */
        function cargarProductoParaEdicion(id) {
            const producto = productos.find(p => p.id === id);
            if (producto) {
                productIdInput.value = producto.id;
                productNameInput.value = producto.nombre;
                productPriceInput.value = producto.precio;
                productStockInput.value = producto.DISPONIBLE;
                productImageUrlInput.value = producto.urlImagen || '';
                productCategoryInput.value = producto.categoria;
                addUpdateBtn.textContent = 'Actualizar Producto';
                // Hace scroll al formulario para que el usuario lo vea
                productForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        /**
         * Elimina un producto del inventario.
         * @param {number} id - El ID del producto a eliminar.
         */
        function eliminarProducto(id) {
            if (confirm('¿Estás seguro de que quieres eliminar este producto?')) {
                productos = productos.filter(p => p.id !== id);
                saveProducts();
                actualizarInventarioVisual();
            }
        }

        /**
         * Limpia el formulario de gestión de productos.
         */
        function clearForm() {
            productIdInput.value = '';
            productNameInput.value = '';
            productPriceInput.value = '';
            productStockInput.value = '';
            productImageUrlInput.value = '';
            productCategoryInput.value = 'accesorios'; // Restablece a la primera opción
            addUpdateBtn.textContent = 'Agregar Producto';
        }

        // --- Event Listeners (Manejo de Eventos) ---

        // Envío del formulario: Añadir o Actualizar producto
        productForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Evita que la página se recargue

            const id = productIdInput.value ? parseInt(productIdInput.value) : null;
            const nombre = productNameInput.value;
            const precio = parseFloat(productPriceInput.value);
            const stock = parseInt(productStockInput.value);
            const urlImagen = productImageUrlInput.value;
            const categoria = productCategoryInput.value;

            if (id) {
                // Actualizar producto existente
                const index = productos.findIndex(p => p.id === id);
                if (index !== -1) {
                    productos[index] = { ...productos[index], nombre, precio, DISPONIBLE: stock, urlImagen, categoria };
                }
            } else {
                // Agregar nuevo producto
                const nuevoProducto = {
                    id: Date.now(), // Genera un ID único basado en la marca de tiempo
                    nombre,
                    precio,
                    DISPONIBLE: stock,
                    urlImagen,
                    categoria
                };
                productos.push(nuevoProducto);
            }

            saveProducts();
            actualizarInventarioVisual();
            clearForm(); // Limpia el formulario después de añadir/actualizar
        });

        // Botón "Limpiar Formulario"
        clearFormBtn.addEventListener('click', clearForm);

        // Toggle del menú de hamburguesa
        hotdogMenuToggle.addEventListener('click', () => {
            mainMenuContent.classList.toggle('active');
            hotdogMenuToggle.classList.toggle('open'); // Cambia la clase para la animación de la X
        });

        // Cerrar menú al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (!mainMenuContent.contains(e.target) && !hotdogMenuToggle.contains(e.target)) {
                if (mainMenuContent.classList.contains('active')) {
                    mainMenuContent.classList.remove('active');
                    hotdogMenuToggle.classList.remove('open');
                }
            }
        });

        // Redirecciones de los botones del menú
        mostrarPreciosBtn.addEventListener('click', () => {
            window.location.href = 'erick 2.html'; // Asegúrate que esta sea la URL correcta de la página de precios
        });

        mostrarPagoBtn.addEventListener('click', () => {
            window.location.href = 'pago.html'; // Asegúrate que esta sea la URL correcta de la página de pago
        });

        clienteRegistroBtn.addEventListener('click', () => {
            window.location.href = 'registro_cliente.html'; // Asegúrate que esta sea la URL correcta de la página de registro de cliente
        });

        // Lógica de los botones de toggle de las secciones de producto
        toggleAccesoriosBtn.addEventListener('click', () => {
            listaAccesoriosUl.style.display = listaAccesoriosUl.style.display === 'none' ? 'block' : 'none';
            toggleAccesoriosBtn.textContent = listaAccesoriosUl.style.display === 'none' ? 'Mostrar' : 'Ocultar';
        });

        toggleComputadorasBtn.addEventListener('click', () => {
            listaComputadorasUl.style.display = listaComputadorasUl.style.display === 'none' ? 'block' : 'none';
            toggleComputadorasBtn.textContent = listaComputadorasUl.style.display === 'none' ? 'Mostrar' : 'Ocultar';
        });

        toggleComponentesBtn.addEventListener('click', () => { // Nuevo evento para componentes
            listaComponentesUl.style.display = listaComponentesUl.style.display === 'none' ? 'block' : 'none';
            toggleComponentesBtn.textContent = listaComponentesUl.style.display === 'none' ? 'Mostrar' : 'Ocultar';
        });
        // --- Selección de imagen local para el producto ---
        // Crea el input file dinámicamente y lo inserta después del campo URL
        const imageFileInput = document.createElement('input');
        imageFileInput.type = 'file';
        imageFileInput.accept = 'image/*';
        imageFileInput.id = 'product-image-file';
        imageFileInput.style.marginBottom = '15px';
        productImageUrlInput.parentNode.insertBefore(imageFileInput, productImageUrlInput.nextSibling);

        // Al seleccionar una imagen, la convierte a base64 y la pone en el campo URL
        imageFileInput.addEventListener('change', function () {
            const file = imageFileInput.files[0];
            if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                productImageUrlInput.value = e.target.result; // base64
            };
            reader.readAsDataURL(file);
            }
        });

        // Al editar un producto, limpia el input file
        function clearImageFileInput() {
            imageFileInput.value = '';
        }
        // Modifica clearForm para limpiar también el input file
        const originalClearForm = clearForm;
        clearForm = function () {
            originalClearForm();
            clearImageFileInput();
        };

        // --- Inicialización ---
        // Llama a la función para mostrar el inventario cuando la página carga
        document.addEventListener('DOMContentLoaded', actualizarInventarioVisual);

    </script>
</body>
</html>
