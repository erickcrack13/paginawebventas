<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro e Inicio de Sesión</title>
    <style>
        /* Aquí va todo el CSS */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px; /* Añadido un poco de padding para pantallas muy pequeñas */
            box-sizing: border-box; /* Para que el padding no afecte el min-height */
        }

        .container {
            display: flex;
            gap: 30px; /* Espacio entre los formularios */
            flex-wrap: wrap; /* Permite que los formularios se apilen en pantallas pequeñas */
            justify-content: center;
            max-width: 900px; /* Limita el ancho máximo del contenedor */
            width: 100%;
        }

        .form-box {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%; /* Por defecto, ocupa todo el ancho disponible en su contenedor */
            max-width: 400px; /* Ancho máximo para cada formulario individual */
            box-sizing: border-box; /* Incluye padding y border en el ancho total */
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* Para que el padding no aumente el ancho */
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Registro de Usuario</h2>
            <form action="/register" method="POST">
                <div class="input-group">
                    <label for="reg-username">Nombre de Usuario:</label>
                    <input type="text" id="reg-username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">Email:</label>
                    <input type="email" id="reg-email" name="email" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Contraseña:</label>
                    <input type="password" id="reg-password" name="password" required>
                </div>
                <button type="submit" class="btn">Registrarse</button>
            </form>
        </div>

        <div class="form-box">
            <h2>Inicio de Sesión</h2>
            <form action="/login" method="POST">
                <div class="input-group">
                    <label for="login-username">Nombre de Usuario o Email:</label>
                    <input type="text" id="login-username" name="username_email" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="btn">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
